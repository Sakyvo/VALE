<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VALE</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=44">
</head>
<body>
  <header>
    <a href="/" class="logo">VALE</a>
    <nav></nav>
  </header>

  <div class="admin-container">
    <h1>ADMIN</h1>
    <div id="message"></div>

    <div id="login-required" class="login-form">
      <p>Please login to access admin panel.</p>
      <button class="btn btn-primary" id="show-login-btn">LOGIN</button>
    </div>

    <div id="admin-section" class="admin-panel is-hidden">
      <div class="form-group">
        <label>ADD TO LISTS (optional)</label>
        <div class="form-row">
          <input type="text" id="list-search" class="form-input" placeholder="Search lists...">
          <button class="sort-btn" id="list-sort-btn">A-Z</button>
        </div>
        <div id="list-checkboxes"></div>
        <button class="btn btn-secondary btn-compact" id="create-list-btn">+ NEW LIST</button>
      </div>
      <div class="pack-list">
        <h2 class="panel-heading">EXISTING PACKS</h2>
        <div class="form-row">
          <input type="text" id="pack-search" class="form-input" placeholder="Search packs...">
          <button class="sort-btn" id="admin-sort-btn">A-Z</button>
        </div>
        <div id="pack-list"></div>
      </div>

      <div class="panel-section">
        <button class="btn btn-secondary" id="manual-build-btn">RUN BUILD</button>
        <button class="btn btn-secondary" id="maintenance-btn">MAINTENANCE: --</button>
      </div>
    </div>
  </div>

  <footer>
    <p>VALE Project</p>
  </footer>

  <script src="/assets/js/toast.js?v=2"></script>
  <script src="/assets/js/auth.js?v=6"></script>
  <script src="/assets/js/admin.js?v=6"></script>
</body>
</html>
